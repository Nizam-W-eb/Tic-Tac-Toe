<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tic-Tac-Toe</title>
</head>
<body>
    <section id="home-page">
        <div class="title">
            <h1 class="title-name">Tic-Tac-Toe</h1>
        </div>
        <div class="button">
            <button class="start-button">Start</button>
        </div>
    </section>


    <section id="player-name-page" hidden>
        <div class="player-title">
            <h1 class="player-title-text">Tic-Tac-Toe</h1>
        </div>
        <form class="player-form">
            <div class="player-names">
                <div class="x-name-div">
                    <label for="x-name">X</label>
                    <input class="x-name x-text" type="text" placeholder="Enter X name" required>
                </div>
                <div class="o-name-div">
                    <label for="o-name">O</label>
                    <input class="o-name o-text" type="text" placeholder="Enter O name" required>
                </div>
            </div>
            <div class="player-button-div">
                <button type="button" class="player-button">Enter</button>
            </div>
        </form>    
    </section>


    <section id="game-page" hidden>
        <div class="game-title">
            <h1 class="game-title-text">Tic-Tac-Toe</h1>
        </div>
        <div class="game">
            <div class="game-turn game-board-text">x turn</div>
            <div class="points">
                <div class="point-x">point-x:</div>
                <div class="point-o">point-o:</div>
            </div>
            <div class="game-board">
                <div class="game-tile" id="1"></div>
                <div class="game-tile" id="2"></div>
                <div class="game-tile" id="3"></div>
                <div class="game-tile" id="4"></div>
                <div class="game-tile" id="5"></div>
                <div class="game-tile" id="6"></div>
                <div class="game-tile" id="7"></div>
                <div class="game-tile" id="8"></div>
                <div class="game-tile" id="9"></div>
            </div>
            <div class="game-round game-board-text">round 1</div>
        </div>
    </section>
    <section id="win-page" hidden>
        <div class="win-page-div">
            <p class="win-page-text">You win!!</p>
        </div>
        <div class="win-points points">
            <div class="win-point-x">point-x:</div>
            <div class="win-point-o">point-o:</div>
        </div>      
        <div class="retry">
            <button class="retry-button">Retry</button>
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
